# First exercised 2026-10-22 on ubuntu-latest: the T0 job went green in 3m14s
# with a cold image build, which also settles RDY-23 (the image was developed on
# arm64 and CI runners are amd64). It is still not a gate; see the CI roadmap in
# README.md.
#
# That first run found a real flaw in this file, which is why the key gate below
# looks the way it does. The job condition tests the *event*, which is only a
# proxy for the secret: on a repository where no key has been configured the T1
# job ran anyway, the suite's own guard correctly refused, and the job went red
# on every push. A tier that cannot run should skip, not fail, or people learn to
# ignore CI. So the event condition now does what it is actually good for -- not
# spending a runner on an unlabelled fork PR -- and the secret itself decides
# whether T1 does any work.
#
# The split is the part that matters for safety: the keyless tier runs
# everywhere, including on pull requests from forks, because it needs no secret.
# The model tier only does work where the key exists, so a fork PR can neither
# exfiltrate it nor spend money.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly, for the slow and repeated tiers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    name: T0 (keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Almost all of the build is the 256 MB Claude Code binary. Because
      # CLAUDE_VERSION is pinned, this layer is stable until the pin moves.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcp-client-tests:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run keyless tier
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/artifacts" mcp-client-tests:ci t0

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t0-artifacts
          path: artifacts/
          if-no-files-found: ignore

  t1:
    name: T1 (model tier)
    needs: t0
    # A cost gate, not the key gate: do not start a runner for an unlabelled
    # fork PR. Whether there is a key to use is decided in the first step,
    # because the `secrets` context is not available in a job-level `if`.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-model-tier')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The model tier is probabilistic. Until the suite computes a pass rate
    # (DET-06/DET-07 in PLAN.md), it reports rather than gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # The key is read through the environment and only its emptiness is
      # tested, so the value itself never reaches a command line or a log.
      - name: Is a key configured?
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=model tier skipped::no ANTHROPIC_API_KEY secret is configured on this repository, so the model tier has nothing to run. The keyless tier covers everything that does not need a model."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.key.outputs.present == 'true'

      - name: Build image
        if: steps.key.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcp-client-tests:ci
          cache-from: type=gha

      - name: Run model tier
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The slow characterization tests only on the nightly run.
          SUITE_SLOW: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD/artifacts:/artifacts" \
            -e ANTHROPIC_API_KEY \
            -e SUITE_SLOW \
            mcp-client-tests:ci t1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t1-artifacts
          path: artifacts/
          if-no-files-found: ignore
